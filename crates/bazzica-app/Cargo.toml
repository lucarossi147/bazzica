[package]
name = "bazzica-app"
description = "Bazzica web app (Dioxus, runs in the browser as a PWA)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bazzica-core = { path = "../bazzica-core" }
bazzica-net = { path = "../bazzica-net" }
bazzica-rete = { path = "../bazzica-rete" }
dioxus = { version = "=0.7.9", features = ["web"] }
futures-timer = { version = "3", features = ["wasm-bindgen"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Storage", "History", "Navigator", "Clipboard", "VisibilityState"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
log = "0.4"
serde_json.workspace = true
wasm-bindgen = "0.2"
console_log = "1"
