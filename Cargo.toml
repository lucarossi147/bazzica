[workspace]
resolver = "3"
members = ["crates/bazzica-core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/lucarossi147/bazzica"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The trace conformance suite replays ~35k game steps; keep tests fast without a release build.
[profile.test]
opt-level = 2
