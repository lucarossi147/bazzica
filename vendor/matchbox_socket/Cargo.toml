autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Painless WebRTC peer-to-peer full-mesh networking socket"
readme = "README.md"
keywords = [
    "gamedev",
    "webrtc",
    "peer-to-peer",
    "networking",
    "wasm",
]
categories = [
    "network-programming",
    "game-development",
    "wasm",
    "web-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/johanhelsing/matchbox"
