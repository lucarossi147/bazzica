name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@v1.26.2
      - name: Install the Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.9 --no-confirm --force
      - name: Bundle
        working-directory: crates/bazzica-app
        run: dx bundle --platform web --release
      - name: Single-page app fallback
        run: cp crates/bazzica-app/dist/public/index.html crates/bazzica-app/dist/public/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: crates/bazzica-app/dist/public

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
